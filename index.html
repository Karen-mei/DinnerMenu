<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>献立アプリ</title>
<meta name="theme-color" content="#ff8a65">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>献立アプリ</h1>
</header>

<main>
  <section class="card">
    <h2>食べたいものメモ</h2>
    <form id="wish-form" class="add-form">
      <input type="text" id="wish-input" placeholder="例：麻婆豆腐" autocomplete="off" required>
      <button type="submit">追加</button>
    </form>
    <ul id="wish-list" class="wish-list"></ul>
    <p id="empty-message" class="empty-message">まだメモがありません。食べたいものを追加してみましょう。</p>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
