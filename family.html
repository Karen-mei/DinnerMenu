<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家族構成 - 献立アプリ</title>
<meta name="theme-color" content="#ff8a65">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <a href="index.html" class="back-link">← 戻る</a>
  <h1>家族構成</h1>
</header>

<main>
  <section class="card">
    <p class="section-note">ここに登録した人が、「今週の予定」で日ごとに選べるようになります。大人/子どもの区分と、子どもの食べる量の段階は、AIが考える食材の分量に使われます。</p>
    <form id="family-form" class="stock-form">
      <input type="text" id="family-name-input" placeholder="名前（例：パパ）" autocomplete="off" required>
      <select id="family-type-input">
        <option value="adult">大人</option>
        <option value="child">子ども</option>
      </select>
      <select id="family-phase-input" hidden>
        <option value="">食べる量の段階を選ぶ</option>
        <option value="離乳食初期（ごく少量）">離乳食初期（ごく少量）</option>
        <option value="離乳食中期（少量）">離乳食中期（少量）</option>
        <option value="離乳食後期（大人の1/4量ほど）">離乳食後期（大人の1/4量ほど）</option>
        <option value="離乳食完了期（大人の1/3量ほど）">離乳食完了期（大人の1/3量ほど）</option>
        <option value="幼児食（大人の半分程度）">幼児食（大人の半分程度）</option>
        <option value="ほぼ大人と同じ量">ほぼ大人と同じ量</option>
      </select>
      <button type="submit">追加</button>
    </form>
    <ul id="family-list" class="pantry-list"></ul>
  </section>
</main>

<script src="js/family.js"></script>
</body>
</html>
